name: Validate MCP packages

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r integrations/mcp_server/requirements.txt
      - run: python -m unittest discover -s integrations/mcp_server/tests -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
